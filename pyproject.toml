[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fridge-agent"
version = "0.1.0"
description = "AI agent for fridge inventory, recipes and meal planning"
requires-python = ">=3.11"

dependencies = [
    "aiohttp",
    "Jinja2",
    "httpx",
    "pydantic",
]

[project.scripts]
fridge-agent = "fridge_agent.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["fridge_agent*"]
namespaces = false

[tool.setuptools.package-data]
fridge_agent = [
    "templates/*.html",
]